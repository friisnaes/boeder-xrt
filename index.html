  --green:#17352A; --green-2:#1E4234; --paper:#F5EFE2; --paper-2:#ECE3CF;
  --ink:#221E15; --brass:#B9924C; --brass-2:#8F6E33; --red:#A5342A;
  --muted:#6E6552; --ok:#2E6B4F; --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Inter',system-ui,sans-serif; background:var(--green); color:var(--paper);
  max-width:520px; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column;
  background-image:radial-gradient(circle at 50% -10%, #234A3A 0%, var(--green) 55%);
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
h1,h2,.serif{font-family:'Fraunces',serif}
.num{font-variant-numeric:tabular-nums}

/* Header */
header{padding:18px 18px 10px;text-align:center}
header .club{font-size:11px;letter-spacing:.22em;color:var(--brass);text-transform:uppercase;font-weight:600}
header h1{font-size:26px;font-weight:900;letter-spacing:.01em;margin-top:2px}
header .motto{font-family:'Fraunces',serif;font-style:italic;font-size:12.5px;color:rgba(245,239,226,.55);margin-top:4px}

/* Tabs */
nav{display:flex;gap:6px;padding:8px 14px 12px}
nav button{flex:1;padding:9px 4px;border-radius:999px;font-size:12.5px;font-weight:600;color:rgba(245,239,226,.6);border:1px solid rgba(245,239,226,.18)}
nav button.on{background:var(--brass);color:var(--green);border-color:var(--brass)}

main{flex:1;padding:0 14px 170px;overflow-y:auto}
/* Logo watermark on paper surfaces */
.wm{position:relative;overflow:hidden}
.wm>*{position:relative;z-index:1}
.wm::before{content:'';position:absolute;inset:0;background:var(--logo) center 55%/72% no-repeat;opacity:.055;pointer-events:none;z-index:0}
/* Report page (link til kassereren) */
.report{background:var(--paper);color:var(--ink);min-height:100dvh;padding:34px 22px 60px;position:relative;overflow:hidden}
.report>*{position:relative;z-index:1}
.report::before{content:'';position:absolute;inset:0;background:var(--logo) center 42%/86% no-repeat;opacity:.05;pointer-events:none;z-index:0}
.report .rlogo{display:block;margin:0 auto 6px;width:150px}
.report .rclub{text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:var(--brass-2)}
.report h1{font-size:30px;font-weight:900;text-align:center;margin-top:10px}
.report .rdate{text-align:center;font-size:13px;color:var(--muted);margin:4px 0 26px}
.report .rrule{border:none;border-top:2px solid var(--ink);margin:0 0 6px}
.report .srow{font-size:15.5px;padding:9px 0}
.report .totline b{font-size:28px}
.report .rpay{margin-top:26px;text-align:center;font-size:14px;line-height:1.6}
.report .rpay b{font-family:'Fraunces',serif}
.report .rmotto{text-align:center;font-family:'Fraunces',serif;font-style:italic;font-size:13px;color:var(--muted);margin-top:30px}
.report .rstamp{margin:26px auto 0;width:max-content;border:2.5px solid var(--red);color:var(--red);font-weight:900;font-family:'Fraunces',serif;letter-spacing:.18em;padding:7px 18px;border-radius:6px;transform:rotate(-4deg);text-transform:uppercase;font-size:15px;opacity:.85}

/* Meeting banner */
.mbanner{background:rgba(0,0,0,.22);border:1px solid rgba(185,146,76,.35);border-radius:var(--radius);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mbanner .mname{font-family:'Fraunces',serif;font-weight:700;font-size:17px}
.mbanner .mdate{font-size:12px;color:rgba(245,239,226,.55);margin-top:1px}
.mbanner .mtotal{font-family:'Fraunces',serif;font-weight:900;font-size:24px;color:var(--brass)}
.mbanner .mtotal small{font-size:11px;font-weight:600;display:block;text-align:right;color:rgba(245,239,226,.5);font-family:'Inter',sans-serif}

/* Member ledger */
.ledger{background:var(--paper);color:var(--ink);border-radius:var(--radius);overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.mrow{display:flex;align-items:center;width:100%;text-align:left;padding:13px 14px;border-bottom:1px solid rgba(34,30,21,.12);gap:10px}
.mrow:last-child{border-bottom:none}
.mrow:active{background:var(--paper-2)}
.mrow .nm{font-weight:600;font-size:16px;flex:1}
.mrow .cnt{font-size:11px;color:var(--muted)}
.mrow .amt{font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:var(--red);min-width:64px;text-align:right}
.mrow .amt.zero{color:rgba(34,30,21,.28)}
.mrow.afbud .nm{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(110,101,82,.5)}
.mrow.afbud .amt{color:var(--muted);font-size:12px;font-family:'Inter',sans-serif;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.empty{padding:40px 20px;text-align:center;color:rgba(245,239,226,.6);font-size:14px;line-height:1.6}

/* Bottom action bar */
.bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--green) 70%,transparent);display:flex;gap:10px}
.btn{flex:1;padding:15px;border-radius:var(--radius);font-size:15px;font-weight:700;text-align:center}
.btn-brass{background:var(--brass);color:var(--green)}
.btn-line{border:1.5px solid rgba(245,239,226,.35);color:var(--paper)}
.btn:active{opacity:.8}

/* Bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.sheet{position:fixed;bottom:0;left:50%;transform:translate(-50%,105%);width:100%;max-width:520px;background:var(--paper);color:var(--ink);border-radius:20px 20px 0 0;z-index:50;transition:transform .25s cubic-bezier(.3,1,.4,1);max-height:86dvh;display:flex;flex-direction:column}
.open .scrim{opacity:1;pointer-events:auto}
.open .sheet{transform:translate(-50%,0)}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:rgba(34,30,21,.2);margin:10px auto 0}
.sheet .shead{padding:10px 18px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sheet .shead h2{font-size:21px;font-weight:900}
.sheet .shead .stot{font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:var(--red)}
.sheet .body{overflow-y:auto;padding:0 14px calc(18px + env(safe-area-inset-bottom))}

.finegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fbtn{background:#fff;border:1px solid rgba(34,30,21,.16);border-radius:12px;padding:11px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:64px;justify-content:center}
.fbtn:active{background:var(--paper-2)}
.fbtn .fl{font-size:12.5px;font-weight:600;line-height:1.25}
.fbtn .fa{font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--red)}
.fbtn.credit .fa{color:var(--ok)}
.fbtn.wide{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;min-height:0}

.seg{display:flex;gap:6px;margin:10px 0 4px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(34,30,21,.2);font-weight:700;font-size:14px}
.seg button.on{background:var(--green);color:var(--paper);border-color:var(--green)}

.mytitle{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.frow{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid rgba(34,30,21,.12);border-radius:10px;padding:9px 12px;margin-bottom:6px}
.frow .fl{flex:1;font-size:13px;font-weight:500}
.frow .fa{font-family:'Fraunces',serif;font-weight:700;color:var(--red)}
.frow .del{width:30px;height:30px;border-radius:8px;background:rgba(165,52,42,.1);color:var(--red);font-size:16px;font-weight:700;line-height:30px;text-align:center}
.afbudtoggle{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1.5px dashed rgba(34,30,21,.3);font-weight:600;font-size:13.5px;color:var(--muted)}
.afbudtoggle.on{background:rgba(110,101,82,.12);border-style:solid}

/* Summary / opgørelse */
.card{background:var(--paper);color:var(--ink);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.card h2{font-size:19px;font-weight:900;margin-bottom:2px}
.card .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.srow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed rgba(34,30,21,.15);font-size:14.5px}
.srow:last-of-type{border-bottom:none}
.srow b{font-family:'Fraunces',serif;font-weight:700;color:var(--red)}
.srow.dim{color:var(--muted)} .srow.dim b{color:var(--muted);font-family:'Inter',sans-serif;font-size:12px;font-weight:600}
.totline{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);margin-top:10px;padding-top:10px;font-weight:700}
.totline b{font-family:'Fraunces',serif;font-size:24px;font-weight:900}

/* Version log */
.loghead{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;font-family:'Inter',sans-serif;color:var(--ink);text-align:left}
.logbody{display:none;margin-top:10px;border-top:1px solid rgba(34,30,21,.12);padding-top:8px;max-height:300px;overflow-y:auto}
.logopen .logbody{display:block}
.lrow{display:flex;gap:10px;padding:5px 0;font-size:12.5px;line-height:1.4;border-bottom:1px dashed rgba(34,30,21,.08)}
.lrow .lt{color:var(--muted);white-space:nowrap;font-size:11.5px;padding-top:1px}
.lrow .lx{flex:1}
.lrow.mark .lx{font-weight:700;color:var(--brass-2)}

/* Season standings */
.seasonrow{border-bottom:1px dashed rgba(34,30,21,.15)}
.seasonrow:last-of-type{border-bottom:none}
.seasonhead{width:100%;display:flex;align-items:center;gap:10px;padding:9px 0;text-align:left;color:var(--ink)}
.seasonhead .rk{width:22px;font-size:12px;font-weight:700;color:var(--muted)}
.seasonhead .nm{flex:1;font-weight:600;font-size:14.5px}
.seasonhead .cnt{font-size:11px;color:var(--muted)}
.seasonhead .amt{font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:var(--red);min-width:66px;text-align:right}
.seasonrow.king .seasonhead .rk{color:var(--brass-2)}
.crown{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brass-2);background:rgba(185,146,76,.15);padding:2px 7px;border-radius:999px;margin-left:6px;font-family:'Inter',sans-serif}
.breakdown{display:none;padding:0 0 8px 32px}
.bopen .breakdown{display:block}

/* History */
.hrow{width:100%;text-align:left;background:rgba(0,0,0,.22);border:1px solid rgba(245,239,226,.15);border-radius:var(--radius);padding:13px 15px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.hrow .hn{font-family:'Fraunces',serif;font-weight:700;font-size:16px}
.hrow .hd{font-size:12px;color:rgba(245,239,226,.55);margin-top:2px}
.hrow .ht{font-family:'Fraunces',serif;font-weight:900;font-size:19px;color:var(--brass)}
.badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(185,146,76,.2);color:var(--brass);margin-left:8px}

/* Settings */
.set .card{padding:14px}
.set input[type=text]{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(34,30,21,.25);font-size:14px;font-family:inherit;background:#fff;margin-bottom:8px}
.set .inline{display:flex;gap:8px}
.set .inline input{flex:1;margin-bottom:0}
.set .small{padding:11px 14px;border-radius:10px;background:var(--green);color:var(--paper);font-weight:700;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid rgba(34,30,21,.18);border-radius:999px;padding:6px 6px 6px 13px;margin:0 6px 6px 0;font-size:13px;font-weight:600}
.chip button{width:22px;height:22px;border-radius:50%;background:rgba(165,52,42,.12);color:var(--red);font-weight:700;font-size:13px}
.dangerbtn{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--red);color:var(--red);font-weight:700;font-size:13px;margin-top:6px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--paper);color:var(--ink);padding:11px 20px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:transform .25s;z-index:99}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="club">XRT73 · Bødeprotokol</div>
  <h1 id="hTitle">Bøder 2026</h1>
  <div class="motto">»Bødemesteren har ret – også når han tager fejl.«</div>
</header>

<nav>
  <button id="tabMeet" class="on" onclick="showTab('meet')">Møde</button>
  <button id="tabSum" onclick="showTab('sum')">Opgørelse</button>
  <button id="tabHist" onclick="showTab('hist')">Historik</button>
  <button id="tabSet" onclick="showTab('set')">Opsætning</button>
</nav>

<main id="main"></main>

<div class="bar" id="bar"></div>

<div id="sheetWrap">
  <div class="scrim" onclick="closeSheet()"></div>
  <div class="sheet">
    <div class="grab"></div>
    <div class="shead"><h2 id="shName"></h2><div class="stot num" id="shTot"></div></div>
    <div class="body" id="shBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ DATA ============ */
const KEY='xrt_boeder_v1';
const DEFAULT_MEMBERS=['Bo','Kim','Boye','Præst','Spuur','Holte','Axel','Tage','Peter','Nis','Bock','Steff','Danny','Jacob','Jes','Fritz'];
const DEFAULT_FINES=[
 {l:'Udeblivelse uden afbud',a:100},
 {l:'For sent',a:50},
 {l:'Telefon fremme',a:25},
 {l:'Forstyrrer når andre taler',a:50},
 {l:'Gentager noget sagt før',a:25},
 {l:'Været i medierne',a:50},
 {l:'Uforberedt til eget punkt',a:75},
 {l:'Over 60 sek. forklaring',a:25},
 {l:'Name-dropping',a:25},
 {l:'Spørgsmål for at høre sig selv',a:50},
 {l:'Rejsehistorie uden pointe',a:25},
 {l:'Alder/ryg/knæ/tisse-problemer',a:25},
 {l:'Selverklæret ekspert',a:50},
 {l:'Modstand mod nyt uden argument',a:50},
 {l:'Glemmer RT-tradition',a:25},
 {l:'Snakker uden at have ordet',a:25},
 {l:'Selvbøde (frivillig)',a:null},
 {l:'Mødets specialbøde',a:null},
 {l:'Bødemesterens fri-kort',a:-50,credit:true},
];
const SEED=[{"name":"Guldsmeden","date":"1. møde · 2026","absent":["Axel","Bock","Spuur"],"entries":[["Boye","For sent",25],["Jes","For sent",50],["Bo","Telefon fremme",25],["Kim","Telefon fremme",25],["Boye","Telefon fremme",25],["Holte","Telefon fremme",25],["Tage","Telefon fremme",25],["Peter","Telefon fremme",25],["Steff","Telefon fremme",25],["Danny","Telefon fremme",25],["Jacob","Telefon fremme",25],["Jes","Telefon fremme",25],["Fritz","Telefon fremme",25],["Axel","Været i medierne",100],["Bo","Uforberedt til eget punkt",25],["Bo","Over 60 sek. forklaring",25],["Fritz","Name-dropping",25],["Kim","Alder/ryg/knæ/tisse-problemer",25],["Jacob","Alder/ryg/knæ/tisse-problemer",25],["Jes","Alder/ryg/knæ/tisse-problemer",25],["Jes","Selverklæret ekspert",25],["Jacob","Bødemesterens fri-kort",-25],["Jes","Bødemesterens fri-kort",-25],["Bo","Mødets specialbøde",100]]},{"name":"The Scandinavian","date":"2. møde · 2026","absent":["Bock","Nis"],"entries":[["Kim","Telefon fremme",25],["Bo","Gentager noget sagt før",25],["Præst","Gentager noget sagt før",25],["Spuur","Gentager noget sagt før",25],["Holte","Gentager noget sagt før",25],["Axel","Gentager noget sagt før",25],["Peter","Gentager noget sagt før",25],["Kim","Uforberedt til eget punkt",75],["Tage","Uforberedt til eget punkt",75],["Danny","Spørgsmål for at høre sig selv",50],["Jacob","Spørgsmål for at høre sig selv",50],["Jes","Spørgsmål for at høre sig selv",50],["Jes","Alder/ryg/knæ/tisse-problemer",25],["Bo","Selverklæret ekspert",50],["Bo","Glemmer RT-tradition",50],["Bo","Snakker uden at have ordet",50],["Kim","Snakker uden at have ordet",25],["Præst","Snakker uden at have ordet",25],["Spuur","Snakker uden at have ordet",25],["Holte","Snakker uden at have ordet",25],["Axel","Snakker uden at have ordet",25],["Peter","Snakker uden at have ordet",25],["Danny","Snakker uden at have ordet",25],["Jacob","Snakker uden at have ordet",25],["Jes","Snakker uden at have ordet",25],["Boye","Selvbøde (frivillig)",25],["Præst","Bødemesterens fri-kort",-50],["Axel","Mødets specialbøde",50],["Steff","Mødets specialbøde",50],["Fritz","Mødets specialbøde",50]]},{"name":"Klubmesterskaber","date":"3. møde · 2026","absent":["Bock","Jes","Tage"],"entries":[["Fritz","Uforberedt til eget punkt",100]]}];
function seedImport(s){
  let added=0;
  const news=[];
  SEED.forEach((sm,i)=>{
    if(s.meetings.some(m=>m.name===sm.name))return;
    const mid=n=>{
      let x=s.members.find(m=>m.name===n);
      if(!x){x={id:'m'+Date.now()+Math.random().toString(36).slice(2,5),name:n};s.members.push(x);}
      return x.id;
    };
    const fid=l=>{const f=s.fines.find(f=>f.l===l);return f?f.id:null;};
    const m={id:'seed'+i,name:sm.name,date:sm.date,closed:true,
      absent:sm.absent.map(mid),
      entries:sm.entries.map(e=>({mid:mid(e[0]),fid:fid(e[1]),label:e[1],amt:e[2],ts:0})),
      log:[{ts:Date.now(),txt:'Importeret fra Excel-arket (XRT_bøder_2026)',mark:true}]};
    news.push(m);added++;
  });
  if(added){s.meetings=[...news,...s.meetings];}
  return added;
}
let S=load();
try{if(seedImport(S))save();}catch(e){}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.members){s.meetings.forEach(m=>{if(!m.log)m.log=[];});return s;}}catch(e){}
  return {
    members:DEFAULT_MEMBERS.map((n,i)=>({id:'m'+i,name:n})),
    fines:DEFAULT_FINES.map((f,i)=>({id:'f'+i,...f})),
    meetings:[],current:null,kasserer:''
  };
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function cur(){return S.meetings.find(m=>m.id===S.current)||null;}
function fmt(n){return n.toLocaleString('da-DK');}
function today(){return new Date().toLocaleDateString('da-DK',{day:'numeric',month:'long',year:'numeric'});}
function memTotal(m,mem){return m.entries.filter(e=>e.mid===mem.id).reduce((s,e)=>s+e.amt,0);}
function meetTotal(m){return m.entries.reduce((s,e)=>s+e.amt,0);}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);}
function log(m,txt,mark){m.log.push({ts:Date.now(),txt,mark:!!mark});}
function stamp(ts){return new Date(ts).toLocaleString('da-DK',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}

/* ============ TABS ============ */
let tab='meet';
function showTab(t){tab=t;['meet','sum','hist','set'].forEach(x=>document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('on',x===t));render();}

/* ============ RENDER ============ */
function render(){
  const main=document.getElementById('main'),bar=document.getElementById('bar');
  bar.innerHTML='';
  if(tab==='meet')renderMeet(main,bar);
  if(tab==='sum')renderSum(main,bar,cur());
  if(tab==='hist')renderHist(main,bar);
  if(tab==='set')renderSet(main,bar);
}

function renderMeet(main,bar){
  const m=cur();
  if(!m){
    main.innerHTML='<div class="empty">Intet aktivt møde.<br>Start et nyt møde for at uddele bøder.</div>';
    bar.innerHTML='<button class="btn btn-brass" onclick="newMeeting()">+ Nyt møde</button>';
    return;
  }
  let rows=S.members.map(mem=>{
    const t=memTotal(m,mem),n=m.entries.filter(e=>e.mid===mem.id).length,ab=m.absent.includes(mem.id);
    if(ab)return `<button class="mrow afbud" onclick="openMember('${mem.id}')"><span class="nm">${mem.name}</span><span class="amt">Afbud${t?' · '+fmt(t)+' kr':''}</span></button>`;
    return `<button class="mrow" onclick="openMember('${mem.id}')">
      <span class="nm">${mem.name}</span>
      ${n?`<span class="cnt">${n} bøde${n>1?'r':''}</span>`:''}
      <span class="amt num ${t?'':'zero'}">${t?fmt(t)+' kr':'–'}</span></button>`;
  }).join('');
  main.innerHTML=`
    <div class="mbanner">
      <div><div class="mname">${m.name}</div><div class="mdate">${m.date}</div></div>
      <div class="mtotal num">${fmt(meetTotal(m))} kr<small>i alt</small></div>
    </div>
    <div class="ledger wm">${rows}</div>`;
  bar.innerHTML='<button class="btn btn-line" onclick="undoLast()">Fortryd sidste</button><button class="btn btn-brass" onclick="showTab(\'sum\')">Afslut møde →</button>';
}

function renderSum(main,bar,m,readonly){
  if(!m){main.innerHTML='<div class="empty">Intet møde at gøre op.<br>Start et møde under fanen »Møde«.</div>';return;}
  const rows=S.members.map(mem=>{
    const t=memTotal(m,mem);
    if(m.absent.includes(mem.id))return `<div class="srow dim"><span>${mem.name} · afbud</span><b class="num">${t?fmt(t)+' kr':'–'}</b></div>`;
    return t?`<div class="srow"><span>${mem.name}</span><b class="num">${fmt(t)} kr</b></div>`:'';
  }).join('');
  const logRows=[...m.log].reverse().map(e=>
    `<div class="lrow${e.mark?' mark':''}"><span class="lt num">${stamp(e.ts)}</span><span class="lx">${e.txt}</span></div>`).join('');
  main.innerHTML=`
    <div class="card wm">
      <h2>${m.name}</h2><div class="sub">${m.date} · Opgørelse${m.closed?' <span class="badge">Afsluttet</span>':''}</div>
      ${rows||'<div class="sub">Ingen bøder uddelt endnu.</div>'}
      <div class="totline"><span>I alt til kassen</span><b class="num">${fmt(meetTotal(m))} kr</b></div>
    </div>
    <div class="card">
      <button class="loghead" onclick="this.parentElement.classList.toggle('logopen')">
        <span>Versionshistorik</span><span class="sub" style="margin:0">${m.log.length} ændringer ▾</span>
      </button>
      <div class="logbody">${logRows||'<div class="sub">Ingen ændringer registreret.</div>'}</div>
    </div>`;
  bar.innerHTML=((m.closed||m.id!==S.current)?`<button class="btn btn-line" onclick="reopen('${m.id}')">${m.closed?'Genåbn møde':'Gør aktivt'}</button>`:
    `<button class="btn btn-line" onclick="copySummary('${m.id}')">Kopiér</button>`)+
    `<button class="btn btn-brass" onclick="sendSummary('${m.id}')">Send til kasserer</button>`;
}

function renderHist(main,bar){
  if(!S.meetings.length){main.innerHTML='<div class="empty">Ingen møder endnu.</div>';return;}
  // Season standings
  const stats=S.members.map(mem=>{
    let tot=0,cnt=0,perMeet=[];
    S.meetings.forEach(m=>{
      const t=memTotal(m,mem),n=m.entries.filter(e=>e.mid===mem.id).length;
      const ab=m.absent.includes(mem.id);
      if(t){tot+=t;cnt+=n;perMeet.push({name:m.name+(ab?' · afbud':''),t});}
      else if(ab)perMeet.push({name:m.name,t:null});
    });
    return {mem,tot,cnt,perMeet};
  }).sort((a,b)=>b.tot-a.tot);
  const seasonTot=S.meetings.reduce((s,m)=>s+meetTotal(m),0);
  const sRows=stats.map((s,i)=>{
    const bd=s.perMeet.map(p=>`<div class="srow ${p.t===null?'dim':''}" style="font-size:13px"><span>${p.name}</span><b class="num">${p.t===null?'Afbud':fmt(p.t)+' kr'}</b></div>`).join('');
    return `<div class="seasonrow${i===0&&s.tot>0?' king':''}">
      <button class="seasonhead" onclick="this.parentElement.classList.toggle('bopen')">
        <span class="rk num">${i+1}</span>
        <span class="nm">${s.mem.name}${i===0&&s.tot>0?' <span class="crown">Bødekongen</span>':''}</span>
        <span class="cnt">${s.cnt} bøde${s.cnt===1?'':'r'}</span>
        <span class="amt num">${s.tot?fmt(s.tot)+' kr':'–'}</span>
      </button>
      <div class="breakdown">${bd||'<div class="sub">Ingen bøder i sæsonen.</div>'}</div>
    </div>`;
  }).join('');
  main.innerHTML=`
    <div class="card" style="padding:14px 16px">
      <h2>Sæsonstilling</h2><div class="sub">Samlede bøder pr. mand · ${S.meetings.length} møde${S.meetings.length===1?'':'r'} · tryk for detaljer</div>
      ${sRows}
      <div class="totline"><span>Sæson i alt</span><b class="num">${fmt(seasonTot)} kr</b></div>
    </div>
    <div class="mytitle" style="color:rgba(245,239,226,.55)">Møder</div>
    `+[...S.meetings].reverse().map(m=>`
    <button class="hrow" onclick="viewOld('${m.id}')">
      <div><div class="hn">${m.name}${m.id===S.current?'<span class="badge">Aktivt</span>':''}</div><div class="hd">${m.date} · ${m.entries.length} bøder</div></div>
      <div class="ht num">${fmt(meetTotal(m))} kr</div>
    </button>`).join('');
}
function viewOld(id){const m=S.meetings.find(x=>x.id===id);tab='sum';['meet','sum','hist','set'].forEach(x=>document.getElementById('tab'+x[0].toUpperCase()+x.slice(1)).classList.toggle('on',x==='sum'));renderSum(document.getElementById('main'),document.getElementById('bar'),m,true);}

function renderSet(main,bar){
  main.innerHTML=`<div class="set">
    <div class="card"><h2>Medlemmer</h2><div class="sub">Tryk × for at fjerne. Bøder på fjernede medlemmer bevares i historikken.</div>
      <div>${S.members.map(m=>`<span class="chip">${m.name}<button onclick="delMember('${m.id}')">×</button></span>`).join('')}</div>
      <div class="inline" style="margin-top:8px"><input type="text" id="newMem" placeholder="Nyt medlem"><button class="small" onclick="addMember()">Tilføj</button></div>
    </div>
    <div class="card"><h2>Kasserer</h2><div class="sub">Navn vises i beskeden, der sendes efter mødet.</div>
      <input type="text" id="kass" value="${S.kasserer||''}" placeholder="Kassererens navn" onchange="S.kasserer=this.value;save()">
    </div>
    <div class="card"><h2>Data</h2><div class="sub">Alt gemmes kun lokalt på denne telefon. Tag en sikkerhedskopi en gang imellem.</div>
      <button class="small" onclick="exportData()">Eksportér sikkerhedskopi</button>
      <button class="dangerbtn" onclick="resetAll()">Nulstil alt</button>
    </div>
  </div>`;
}

/* ============ MEETING ACTIONS ============ */
function newMeeting(){
  const name=prompt('Hvor holdes mødet? (fx Guldsmeden)');
  if(!name)return;
  const m={id:'mt'+Date.now(),name:name.trim(),date:today(),entries:[],absent:[],closed:false,log:[]};
  log(m,'Møde oprettet',true);
  S.meetings.push(m);S.current=m.id;save();showTab('meet');
}
function undoLast(){
  const m=cur();if(!m||!m.entries.length)return toast('Intet at fortryde');
  const e=m.entries.pop();
  log(m,'Fjernet: '+mname(e.mid)+' – '+e.label+' ('+fmt(e.amt)+' kr)');
  save();render();
  toast('Fjernet: '+mname(e.mid)+' '+fmt(e.amt)+' kr');
}

/* ============ MEMBER SHEET ============ */
let sheetMid=null;
function openMember(mid){
  sheetMid=mid;renderSheet();
  document.getElementById('sheetWrap').classList.add('open');
}
function closeSheet(){document.getElementById('sheetWrap').classList.remove('open');sheetMid=null;}
function renderSheet(){
  const m=cur(),mem=S.members.find(x=>x.id===sheetMid);if(!m||!mem)return;
  const ab=m.absent.includes(mem.id);
  document.getElementById('shName').textContent=mem.name;
  document.getElementById('shTot').textContent=fmt(memTotal(m,mem))+' kr';
  const mine=m.entries.filter(e=>e.mid===mem.id);
  document.getElementById('shBody').innerHTML=`
    ${`<div class="finegrid">${S.fines.map(f=>{
      if(f.a===null)return `<button class="fbtn wide" onclick="pickAmount('${f.id}')"><span class="fl">${f.l}</span><span class="fa">vælg beløb…</span></button>`;
      return `<button class="fbtn ${f.credit?'credit':''}" onclick="addFine('${f.id}')"><span class="fl">${f.l}</span><span class="fa num">${f.a>0?fmt(f.a):fmt(f.a)} kr</span></button>`;
    }).join('')}</div>`}
    ${mine.length?`<div class="mytitle">Uddelt til ${mem.name}</div>`+mine.map((e,i)=>`
      <div class="frow"><span class="fl">${e.label}</span><span class="fa num">${fmt(e.amt)} kr</span><button class="del" onclick="delFine(${m.entries.indexOf(e)})">×</button></div>`).join(''):''}
    <button class="afbudtoggle ${ab?'on':''}" onclick="toggleAfbud()">${ab?'Fjern afbud – '+mem.name+' er her alligevel':'Meld afbud for '+mem.name}</button>`;
}
function mname(id){const x=S.members.find(m=>m.id===id);return x?x.name:'(fjernet medlem)';}
function addFine(fid,amount){
  const m=cur(),f=S.fines.find(x=>x.id===fid);
  const amt=amount??f.a;
  m.entries.push({mid:sheetMid,fid,label:f.l,amt,ts:Date.now()});
  log(m,'Bøde: '+mname(sheetMid)+' – '+f.l+' ('+fmt(amt)+' kr)');
  save();render();
  if(navigator.vibrate)navigator.vibrate(20);
  closeSheet();
  const mem=S.members.find(x=>x.id===sheetMid)||{};
  toast((mem.name||'')+': '+f.l);
}
function pickAmount(fid){
  const f=S.fines.find(x=>x.id===fid);
  document.getElementById('shBody').insertAdjacentHTML('afterbegin',
    `<div class="mytitle">${f.l} – vælg beløb</div><div class="seg" id="amtSeg">${[25,50,75,100].map(a=>`<button onclick="addFine('${fid}',${a})">${a}</button>`).join('')}</div>`);
  document.getElementById('amtSeg').scrollIntoView();
}
function delFine(idx){
  const m=cur(),e=m.entries[idx];
  log(m,'Fjernet: '+mname(e.mid)+' – '+e.label+' ('+fmt(e.amt)+' kr)');
  m.entries.splice(idx,1);save();render();renderSheet();
}
function toggleAfbud(){
  const m=cur();const i=m.absent.indexOf(sheetMid);
  if(i>=0){m.absent.splice(i,1);log(m,'Afbud fjernet: '+mname(sheetMid));}
  else{m.absent.push(sheetMid);log(m,'Afbud: '+mname(sheetMid));}
  save();render();renderSheet();
}

/* ============ SUMMARY / SEND ============ */
function summaryText(id){
  const m=S.meetings.find(x=>x.id===id);
  let lines=['XRT73 · Bøder','Møde: '+m.name+' · '+m.date,'––––––––––––––––'];
  S.members.forEach(mem=>{
    const t=memTotal(m,mem);
    if(m.absent.includes(mem.id)){lines.push(mem.name+': '+(t?fmt(t)+' kr (afbud)':'afbud'));return;}
    if(t)lines.push(mem.name+': '+fmt(t)+' kr');
  });
  lines.push('––––––––––––––––','I ALT: '+fmt(meetTotal(m))+' kr');
  lines.push('','Betales til '+(S.kasserer?S.kasserer+' (kasserer)':'kassereren')+' – gerne MobilePay.');
  lines.push('Bøder uddeles med smil – uden diskussion.');
  return lines.join('\n');
}
function markClosed(id){
  const m=S.meetings.find(x=>x.id===id);
  if(!m.closed){m.closed=true;if(S.current===id)S.current=null;log(m,'Opgørelse sendt – møde afsluttet ('+fmt(meetTotal(m))+' kr)',true);}
  else{log(m,'Opgørelse sendt igen ('+fmt(meetTotal(m))+' kr)',true);}
  save();
}
function reopen(id){
  const m=S.meetings.find(x=>x.id===id);
  if(S.current&&S.current!==id&&!confirm('Et andet møde er aktivt. Genåbn "'+m.name+'" alligevel?'))return;
  m.closed=false;S.current=id;
  log(m,'Møde genåbnet – rettelser efter dette tidspunkt',true);
  save();showTab('meet');toast(m.name+' genåbnet');
}
function b64u(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');return decodeURIComponent(escape(atob(s)));}
function reportLink(id){
  const m=S.meetings.find(x=>x.id===id);
  const rows=S.members.map(mem=>{
    const t=memTotal(m,mem),ab=m.absent.includes(mem.id);
    if(!t&&!ab)return null;
    return [mem.name,t,ab?1:0];
  }).filter(Boolean);
  const o={n:m.name,d:m.date,t:meetTotal(m),k:S.kasserer||'',r:rows};
  return location.origin+location.pathname+'#r='+b64u(JSON.stringify(o));
}
async function sendSummary(id){
  const m=S.meetings.find(x=>x.id===id);
  const url=reportLink(id);
  const text='XRT · Bøder · '+m.name+'\nI alt: '+fmt(meetTotal(m))+' kr\nSe opgørelsen: '+url;
  if(navigator.share){try{await navigator.share({title:'XRT Bøder – '+m.name,text});markClosed(id);render();toast('Sendt – mødet er afsluttet');}catch(e){}}
  else{try{await navigator.clipboard.writeText(text);markClosed(id);render();toast('Link kopieret – mødet er afsluttet');}catch(e){prompt('Kopiér:',text);}}
}
async function copySummary(id){
  try{await navigator.clipboard.writeText(summaryText(id));markClosed(id);render();toast('Kopieret – mødet er afsluttet');}
  catch(e){prompt('Kopiér teksten:',summaryText(id));}
}

/* ============ SETTINGS ACTIONS ============ */
function addMember(){
  const v=document.getElementById('newMem').value.trim();if(!v)return;
  S.members.push({id:'m'+Date.now(),name:v});save();render();
}
function delMember(id){
  const mem=S.members.find(m=>m.id===id);
  if(confirm('Fjern '+mem.name+' fra medlemslisten?')){S.members=S.members.filter(m=>m.id!==id);save();render();}
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='xrt73-boeder-backup.json';a.click();
}
function resetAll(){
  if(confirm('Slet ALLE møder, bøder og indstillinger?')&&confirm('Helt sikker? Dette kan ikke fortrydes.')){localStorage.removeItem(KEY);S=load();save();render();toast('Nulstillet');}
}

function renderReport(o){
  document.querySelector('header').style.display='none';
  document.querySelector('nav').style.display='none';
  document.getElementById('bar').style.display='none';
  document.body.style.background='var(--paper)';
  const main=document.getElementById('main');
  main.style.padding='0';
  const rows=o.r.map(r=>{
    const [nm,t,ab]=r;
    if(ab)return `<div class="srow dim"><span>${nm} · afbud</span><b class="num">${t?fmt(t)+' kr':'–'}</b></div>`;
    return `<div class="srow"><span>${nm}</span><b class="num">${fmt(t)} kr</b></div>`;
  }).join('');
  main.innerHTML=`<div class="report">
    <img class="rlogo" src="${getComputedStyle(document.documentElement).getPropertyValue('--logo').trim().slice(5,-2)}" alt="XRT Hellerup">
    <div class="rclub">Bødeprotokol · Opgørelse</div>
    <h1>${o.n}</h1>
    <div class="rdate">${o.d}</div>
    <hr class="rrule">
    ${rows}
    <div class="totline"><span>I alt til kassen</span><b class="num">${fmt(o.t)} kr</b></div>
    <div class="rpay">Betales til <b>${o.k||'kassereren'}</b>${o.k?' (kasserer)':''} – gerne MobilePay.</div>
    <div class="rstamp">Vedtaget uden afstemning</div>
    <div class="rmotto">»Bøder uddeles med smil – uden diskussion.«</div>
  </div>`;
}
(function(){
  if(location.hash.startsWith('#r=')){
    try{renderReport(JSON.parse(unb64u(location.hash.slice(3))));return;}catch(e){}
  }
  render();
})();
</script>
